name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install pinned native host
        run: npm install --prefix "$RUNNER_TEMP/censor-host" --no-audit --no-fund @opencode/cli@2.2.5
      - name: Native smoke with controlled loopback provider and inert shell
        env:
          OPENCODE_BIN: ${{ runner.temp }}/censor-host/node_modules/.bin/opencode
        run: bun run test:live
